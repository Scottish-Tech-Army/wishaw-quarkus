# Datasource configuration (H2 file-based)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=wishaw
quarkus.datasource.password=wishaw
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/wishaw;AUTO_SERVER=TRUE

# Hibernate ORM
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# HTTP session
quarkus.http.auth.session.encryption-key=wishaw-ymca-esports-secret-key-32chars!

# Application


# Security - custom cookie auth via CookieAuthMechanism
# No basic or form auth needed - CookieAuthMechanism reads the wishaw-session cookie
quarkus.http.auth.basic=false
quarkus.http.auth.form.enabled=false
quarkus.http.auth.proactive=false

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Cookie
quarkus.http.cors.exposed-headers=Set-Cookie
quarkus.http.cors.access-control-allow-credentials=true

# Test profile (in-memory H2 for tests)
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:wishaw_test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.flyway.migrate-at-start=true

# OpenAPI / Swagger
quarkus.smallrye-openapi.info-title=Wishaw YMCA Esports API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Backend API for the Wishaw YMCA Esports Login App
quarkus.smallrye-openapi.security-scheme=basic
quarkus.smallrye-openapi.security-scheme-name=BasicAuth
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.swagger-ui.always-include=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."org.scottishtecharmy".level=DEBUG
quarkus.log.category."org.hibernate.SQL".level=DEBUG
quarkus.log.category."org.hibernate.orm.jdbc.bind".level=TRACE
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.color=true
